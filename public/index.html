<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Timer</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --text: #1d2330; --muted: #6b7385; --line: #e3e6ec;
    --accent: #2f6fed; --accent-soft: #e8efff; --run: #14965a; --run-soft: #e4f6ec;
    --warn: #c2410c; --warn-soft: #fff1e6; --danger: #c43c3c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b1f27; --text: #e7eaf0; --muted: #949cad; --line: #2b313c;
      --accent: #6c9bff; --accent-soft: #1f2a42; --run: #3ccf8a; --run-soft: #17322a;
      --warn: #fb923c; --warn-soft: #3a2616; --danger: #f07070;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); }
  .num, .clock { font-variant-numeric: tabular-nums; }
  header { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); }
  .bar { max-width: 1200px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; }
  nav { display: flex; gap: 4px; }
  nav button { background: none; border: 0; padding: 6px 12px; border-radius: 6px; color: var(--muted); font: inherit; cursor: pointer; }
  nav button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .now { margin-left: auto; display: flex; align-items: center; gap: 10px; padding: 5px 10px; border-radius: 8px; background: var(--bg); color: var(--muted); min-width: 0; }
  .now.live { background: var(--run-soft); color: var(--text); }
  .now .clock { font-weight: 700; color: var(--run); }
  .now .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 9px; height: 9px; flex: none; border-radius: 50%; background: var(--run); animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  main { max-width: 1200px; margin: 0 auto; padding: 16px; }
  form.inline { display: flex; gap: 8px; }
  input[type=text], input[type=date], input[type=time], input[type=datetime-local], select, textarea {
    font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; min-width: 0;
  }
  input[type=text] { flex: 1; }
  .btn { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 6px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--muted); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.go { background: var(--run); border-color: var(--run); color: #fff; }
  .btn.small { padding: 3px 9px; font-size: 13px; }
  .btn.ghost { border-color: transparent; color: var(--muted); }
  .btn.ghost:hover { border-color: var(--line); }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .toolbar form.inline { flex: 1; min-width: 260px; }
  .muted { color: var(--muted); }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }

  /* hero: currently running */
  .hero { background: var(--card); border: 1px solid var(--run); box-shadow: 0 0 0 1px var(--run); border-radius: 12px; padding: 16px 20px; margin-bottom: 16px;
          display: flex; gap: 12px 24px; align-items: center; flex-wrap: wrap; }
  .hero .who { flex: 1 1 220px; min-width: 0; }
  .hero .who .proj { color: var(--muted); font-size: 13px; }
  .hero .who .task { font-size: 18px; font-weight: 600; overflow-wrap: anywhere; }
  .hero .who .stint { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .hero .times { text-align: right; }
  .hero .big { font-size: 52px; font-weight: 700; line-height: 1; color: var(--run); letter-spacing: -.02em; }
  .hero .cap { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .hero .total { font-size: 17px; font-weight: 600; margin-top: 6px; }
  .hero .actions { display: flex; gap: 8px; }
  .today { color: var(--muted); font-size: 14px; }

  /* project cards */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px; margin-top: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .card.live { border-color: var(--run); }
  .card-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .card-head h2 { font-size: 16px; margin: 0; flex: 1; overflow-wrap: anywhere; }
  .card-head .sum { font-size: 13px; color: var(--muted); text-align: right; }
  ul.tasks { list-style: none; margin: 0; padding: 0; }
  ul.tasks > li { padding: 10px 14px; border-bottom: 1px solid var(--line); }
  ul.tasks > li.live { background: var(--run-soft); }
  .task-top { display: flex; gap: 10px; align-items: flex-start; }
  .task-top .name { flex: 1; overflow-wrap: anywhere; font-weight: 500; padding-top: 2px; }
  .task-times { text-align: right; }
  .task-times .sess { font-size: 20px; font-weight: 700; line-height: 1.1; }
  li.live .task-times .sess { color: var(--run); }
  .task-times .tot { font-size: 12px; color: var(--muted); }
  .task-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .card form.inline { padding: 10px 14px; }

  /* history */
  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 14px; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  td.num { white-space: nowrap; }
  td.notes { white-space: pre-wrap; max-width: 420px; }
  tr.sub td { background: var(--bg); font-size: 13px; }
  .table-wrap { overflow-x: auto; margin-top: 12px; }
  .pill { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--bg); color: var(--muted); }
  .pill.open { background: var(--run-soft); color: var(--run); }
  .pill.manual { background: var(--accent-soft); color: var(--accent); }
  h3 { margin: 28px 0 10px; font-size: 15px; }
  .finished-list { display: grid; gap: 8px; }
  .finished-list .row { display: flex; gap: 8px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  .finished-list .row span:first-child { flex: 1; }

  /* dialogs */
  .backdrop { position: fixed; inset: 0; background: rgba(10, 14, 22, .55); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
  #modal-root .backdrop { z-index: 25; }
  .modal { background: var(--card); border-radius: 12px; width: min(600px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  .modal h2 { margin: 0 0 4px; font-size: 18px; }
  .modal textarea { width: 100%; min-height: 110px; resize: vertical; }
  .modal .actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 16px; }
  .modal .hint { font-size: 13px; color: var(--muted); }
  .modal label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  .fields { display: flex; gap: 10px; flex-wrap: wrap; }
  .fields > div { flex: 1 1 120px; }
  .fields input { width: 100%; }
  .tabs { display: flex; gap: 4px; margin: 14px 0 4px; border-bottom: 1px solid var(--line); }
  .tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 10px; font: inherit; color: var(--muted); cursor: pointer; }
  .tabs button.on { color: var(--accent); border-color: var(--accent); font-weight: 600; }
  .countdown { font-weight: 600; }
  .countdown.low { color: var(--warn); }
  .warnbox { background: var(--warn-soft); border-radius: 8px; padding: 10px 12px; font-size: 14px; margin-top: 8px; }
  .sess-list { margin-top: 12px; border: 1px solid var(--line); border-radius: 8px; }
  .sess-list .item { padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .sess-list .item:last-child { border-bottom: 0; }
  .sess-list .line { display: flex; gap: 10px; align-items: center; }
  .sess-list .line label { all: unset; flex: 1; display: flex; gap: 10px; align-items: center; cursor: pointer; min-width: 0; }
  .sess-list .line .t { font-size: 18px; font-weight: 700; }
  .sess-list .notes { white-space: pre-wrap; font-size: 13px; color: var(--muted); margin: 6px 0 0 26px; }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--danger); color: #fff; padding: 10px 16px; border-radius: 8px; z-index: 30; }
  .toast.ok { background: var(--run); }
  @media (max-width: 640px) {
    .grid { grid-template-columns: 1fr; }
    .now { margin-left: 0; width: 100%; }
    .hero .times { text-align: left; }
    .hero .big { font-size: 44px; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>⏱ Task Timer</h1>
    <nav>
      <button data-view="dashboard" class="on">Dashboard</button>
      <button data-view="history">History</button>
    </nav>
    <div class="now" id="now"></div>
  </div>
</header>
<main id="app"></main>
<div id="dialog-root"></div>
<div id="modal-root"></div>

<script>
const $ = (sel, el = document) => el.querySelector(sel);
let S = null;            // server state
let clockOffset = 0;     // serverNow - Date.now()
let view = 'dashboard';
let histFilter = '';
let expanded = new Set(); // history: expanded session ids
let draftTimer = null;
let modalKey = null;     // identifies the open notes pop-up
let dialog = null;       // client-side dialog: {type:'addTime'|'close', ...}

// ---------- formatting ----------
const nowMs = () => Date.now() + clockOffset;
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
function clock(ms) {
  const s = Math.floor(Math.max(0, ms) / 1000);
  return `${Math.floor(s / 3600)}:${pad(Math.floor((s % 3600) / 60))}:${pad(s % 60)}`;
}
function hm(ms) {
  const m = Math.floor(Math.max(0, ms) / 60000);
  return `${Math.floor(m / 60)}h ${pad(m % 60)}m`;
}
const hours = (ms) => (ms / 3600000).toFixed(2);
const fmtTime = (t) => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const fmtDate = (t) => new Date(t).toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' });
const dayKey = (t) => { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const timeKey = (t) => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const startOfToday = () => { const d = new Date(nowMs()); d.setHours(0, 0, 0, 0); return d.getTime(); };
const isToday = (t) => dayKey(t) === dayKey(nowMs());
const whenLabel = (t) => isToday(t) ? fmtTime(t) : `${fmtDate(t)} ${fmtTime(t)}`;

// ---------- server ----------
async function api(path, body) {
  try {
    const res = await fetch('/api/' + path, body === undefined ? {} : {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) { toast(data.error || 'Something went wrong'); if (data.state) setState(data.state); return false; }
    setState(data);
    return true;
  } catch {
    toast('Can’t reach the server');
    return false;
  }
}
let lastSig = '';
function setState(s) {
  clockOffset = s.serverNow - Date.now();
  const { serverNow, ...rest } = s;
  const sig = JSON.stringify({ ...rest, pending: rest.pending && { ...rest.pending, draft: null } });
  S = s;
  if (sig === lastSig) return; // nothing changed — don't disturb the page
  lastSig = sig;
  render();
}
function toast(msg, ok = false) {
  const t = document.createElement('div');
  t.className = 'toast' + (ok ? ' ok' : ''); t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

// ---------- derived ----------
const project = (id) => S.projects.find((p) => p.id === id);
const task = (id) => S.tasks.find((t) => t.id === id);
const openSession = (tid) => S.sessions.find((s) => s.taskId === tid && !s.closedAt);
const stintsOf = (sid) => S.stints.filter((st) => st.sessionId === sid).sort((a, b) => a.start - b.start);
function liveMs(tid) { // the in-progress stint (running, or stopped but awaiting notes)
  if (S.running?.taskId === tid) return nowMs() - S.running.start;
  if (S.pending?.taskId === tid) return S.pending.stoppedAt - S.pending.start;
  return 0;
}
function sessionMs(sess) {
  let ms = stintsOf(sess.id).reduce((a, st) => a + st.end - st.start, 0);
  if (!sess.closedAt) ms += liveMs(sess.taskId);
  return ms;
}
const taskSessionMs = (tid) => { const s = openSession(tid); return s ? sessionMs(s) : liveMs(tid); };
const taskTotalMs = (tid) => S.stints.filter((st) => st.taskId === tid).reduce((a, st) => a + st.end - st.start, 0) + liveMs(tid);
const projectTasks = (pid) => S.tasks.filter((t) => t.projectId === pid);
const projectSessionMs = (pid) => projectTasks(pid).reduce((a, t) => a + taskSessionMs(t.id), 0);
const projectTotalMs = (pid) => projectTasks(pid).reduce((a, t) => a + taskTotalMs(t.id), 0);
const sessionNotes = (sess) => stintsOf(sess.id).map((st) => st.notes).filter(Boolean).join('\n');
const openSessions = () => S.sessions.filter((s) => !s.closedAt && task(s.taskId));
const busy = () => !!S.pending;
const sessLabel = (sess) => { const t = task(sess.taskId); return `${esc(project(t.projectId)?.name ?? '')} › <b>${esc(t.name)}</b>`; };

// Values that tick every second, keyed by data-live attributes.
function liveValue(key) {
  const [kind, id] = key.split(':');
  switch (kind) {
    case 'run-sess': return S.running ? clock(taskSessionMs(S.running.taskId)) : '';
    case 'run-total': return S.running ? clock(taskTotalMs(S.running.taskId)) : '';
    case 'run-stint': return S.running ? clock(nowMs() - S.running.start) : '';
    case 'sess': return clock(taskSessionMs(id));
    case 'tot': return clock(taskTotalMs(id));
    case 'psess': return hm(projectSessionMs(id));
    case 'ptot': return hm(projectTotalMs(id));
    case 'sid': { const s = S.sessions.find((x) => x.id === id); return s ? hm(sessionMs(s)) : ''; }
    case 'today': return hm(openSessions().reduce((a, s) => a + sessionMs(s), 0));
  }
  return '';
}
const live = (key) => `<span data-live="${key}">${liveValue(key)}</span>`;

// ---------- render ----------
function render() {
  if (!S) return;
  renderNow();
  if (view === 'dashboard') renderDashboard(); else renderHistory();
  renderDialog();
  renderModal();
}

function renderNow() {
  const el = $('#now');
  if (S.running) {
    const t = task(S.running.taskId);
    el.className = 'now live';
    el.innerHTML = `<span class="dot"></span><span class="label">${esc(t?.name ?? '')}</span>
      <span class="clock">${live('run-sess')}</span>
      <button class="btn small" onclick="api('stop',{})">Stop</button>`;
  } else {
    el.className = 'now';
    el.textContent = S.pending ? 'Waiting for stint notes…' : 'No timer running';
  }
}

function renderDashboard() {
  const app = $('#app');
  const active = S.projects.filter((p) => p.status === 'active');
  const focused = document.activeElement;
  const keepFocus = focused?.dataset?.focusKey;
  const keepVal = focused?.value;
  const r = S.running, rt = r && task(r.taskId);

  app.innerHTML = `
    ${rt ? `<section class="hero">
      <div class="who">
        <div class="proj">${esc(project(rt.projectId)?.name ?? '')}</div>
        <div class="task">${esc(rt.name)}</div>
        <div class="stint">This stint ${live('run-stint')} · started ${whenLabel(r.start)}</div>
      </div>
      <div class="times">
        <div class="cap">Session</div>
        <div class="big clock">${live('run-sess')}</div>
        <div class="total clock"><span class="muted" style="font-weight:400">Task total</span> ${live('run-total')}</div>
      </div>
      <div class="actions">
        <button class="btn" onclick="openAddTime('${rt.id}')">+ Time</button>
        <button class="btn primary" onclick="api('stop',{})">Stop</button>
      </div>
    </section>` : ''}
    <div class="toolbar">
      <form class="inline" onsubmit="addProject(event)">
        <input type="text" name="name" placeholder="New project name…" data-focus-key="new-project" autocomplete="off">
        <button class="btn primary">Add project</button>
      </form>
      <span class="today">Open sessions: <b class="num">${live('today')}</b></span>
      <button class="btn" ${busy() || !openSessions().length ? 'disabled' : ''} onclick="openCloseDialog('endday')">End day…</button>
    </div>
    ${active.length ? `<div class="grid">${active.map(projectCard).join('')}</div>`
      : `<div class="empty">No active projects. Add one above to get started.</div>`}
  `;
  if (keepFocus) {
    const el = app.querySelector(`[data-focus-key="${keepFocus}"]`);
    if (el) { el.value = keepVal; el.focus(); }
  }
}

function projectCard(p) {
  const tasks = projectTasks(p.id).filter((t) => t.status === 'active');
  const isLive = tasks.some((t) => S.running?.taskId === t.id);
  return `<section class="card ${isLive ? 'live' : ''}">
    <div class="card-head">
      <h2>${esc(p.name)}</h2>
      <div class="sum">session <b class="num">${live('psess:' + p.id)}</b><br>total <span class="num">${live('ptot:' + p.id)}</span></div>
      <button class="btn small ghost" ${busy() ? 'disabled' : ''} onclick="finishProject('${p.id}')">Finish</button>
    </div>
    <ul class="tasks">
      ${tasks.map(taskRow).join('') || `<li class="muted">No active tasks</li>`}
    </ul>
    <form class="inline" onsubmit="addTask(event,'${p.id}')">
      <input type="text" name="name" placeholder="Add a task…" data-focus-key="new-task:${p.id}" autocomplete="off">
      <button class="btn small">Add</button>
    </form>
  </section>`;
}

function taskRow(t) {
  const running = S.running?.taskId === t.id;
  const dis = busy() ? 'disabled' : '';
  const hasSession = !!openSession(t.id);
  return `<li class="${running ? 'live' : ''}">
    <div class="task-top">
      <span class="name">${esc(t.name)}</span>
      <div class="task-times">
        <div class="sess clock" title="Current session">${live('sess:' + t.id)}</div>
        <div class="tot">total <span class="clock">${live('tot:' + t.id)}</span></div>
      </div>
    </div>
    <div class="task-actions">
      ${running
        ? `<button class="btn small primary" ${dis} onclick="api('stop',{})">Stop</button>`
        : `<button class="btn small go" ${dis} onclick="api('tasks/${t.id}/start',{})">Start</button>`}
      <button class="btn small" ${dis} onclick="openAddTime('${t.id}')">+ Time</button>
      <span style="flex:1"></span>
      <button class="btn small ghost" ${dis || !hasSession ? 'disabled' : ''} onclick="closeOne('${t.id}')" title="Record this session's total and reset to 0:00">Close session</button>
      <button class="btn small ghost" ${dis} onclick="finishTask('${t.id}')">Finish</button>
    </div>
  </li>`;
}

function renderHistory() {
  const app = $('#app');
  const inFilter = (tid) => !histFilter || task(tid)?.projectId === histFilter;
  const sessions = S.sessions.filter((s) => task(s.taskId) && inFilter(s.taskId)).sort((a, b) => b.openedAt - a.openedAt);
  const total = sessions.reduce((a, s) => a + sessionMs(s), 0);
  const finishedProjects = S.projects.filter((p) => p.status === 'finished');
  const finishedTasks = S.tasks.filter((t) => t.status === 'finished' && project(t.projectId)?.status === 'active');

  app.innerHTML = `
    <div class="toolbar">
      <select onchange="histFilter=this.value; render()">
        <option value="">All projects</option>
        ${S.projects.map((p) => `<option value="${p.id}" ${p.id === histFilter ? 'selected' : ''}>${esc(p.name)}${p.status === 'finished' ? ' (finished)' : ''}</option>`).join('')}
      </select>
      <span class="muted">${sessions.length} session${sessions.length === 1 ? '' : 's'} · ${hm(total)}</span>
      <span style="flex:1"></span>
      <button class="btn" onclick="exportSessions()" ${sessions.length ? '' : 'disabled'}>Export sessions CSV</button>
      <button class="btn" onclick="exportStints()" ${sessions.length ? '' : 'disabled'}>Export stints CSV</button>
    </div>
    ${sessions.length ? `<div class="table-wrap"><table>
      <thead><tr><th>Date</th><th>Project</th><th>Task</th><th>Session</th><th>Hours</th><th>Notes</th><th></th></tr></thead>
      <tbody>${sessions.map(historyRows).join('')}</tbody></table></div>`
      : `<div class="empty">No sessions yet.</div>`}

    ${finishedTasks.length ? `<h3>Finished tasks (in active projects)</h3><div class="finished-list">
      ${finishedTasks.map((t) => `<div class="row"><span>${esc(project(t.projectId).name)} › ${esc(t.name)}</span>
        <span class="muted">${hm(taskTotalMs(t.id))}</span>
        <button class="btn small" onclick="api('tasks/${t.id}/reopen',{})">Reopen</button></div>`).join('')}</div>` : ''}

    ${finishedProjects.length ? `<h3>Finished projects</h3><div class="finished-list">
      ${finishedProjects.map((p) => `<div class="row"><span>${esc(p.name)}</span>
        <span class="muted">${hm(projectTotalMs(p.id))}</span>
        <button class="btn small" onclick="api('projects/${p.id}/reopen',{})">Reopen</button></div>`).join('')}</div>` : ''}
  `;
}

function historyRows(s) {
  const t = task(s.taskId), p = project(t.projectId);
  const stints = stintsOf(s.id);
  const open = expanded.has(s.id);
  const ms = sessionMs(s);
  let html = `<tr>
    <td class="num">${fmtDate(s.openedAt)}${s.closedAt ? '' : ' <span class="pill open">open</span>'}</td>
    <td>${esc(p?.name ?? '?')}</td><td>${esc(t.name)}</td>
    <td class="num"><b>${s.closedAt ? clock(ms) : live('sid:' + s.id)}</b></td>
    <td class="num">${hours(ms)}</td>
    <td class="notes">${esc(sessionNotes(s)) || '<span class="muted">—</span>'}</td>
    <td class="num"><button class="btn small ghost" onclick="toggleExpand('${s.id}')">${stints.length} stint${stints.length === 1 ? '' : 's'} ${open ? '▾' : '▸'}</button>
      <button class="btn small ghost" onclick="copyText(${esc(JSON.stringify(sessionNotes(s)))})" ${sessionNotes(s) ? '' : 'disabled'}>Copy notes</button></td>
  </tr>`;
  if (open) {
    html += stints.map((st) => `<tr class="sub">
      <td></td><td colspan="2" class="num">${whenLabel(st.start)} – ${fmtTime(st.end)} ${st.manual ? '<span class="pill manual">added</span>' : ''}</td>
      <td class="num">${clock(st.end - st.start)}</td><td></td>
      <td class="notes">${esc(st.notes) || '<span class="muted">—</span>'}</td>
      <td><button class="btn small ghost" onclick="deleteStint('${st.id}')">Delete</button></td></tr>`).join('');
    if (!stints.length) html += `<tr class="sub"><td></td><td colspan="6" class="muted">Only the running stint so far.</td></tr>`;
  }
  return html;
}

// ---------- notes pop-up (server-driven) ----------
function renderModal() {
  const root = $('#modal-root');
  const p = S.pending;
  if (!p) { root.innerHTML = ''; modalKey = null; return; }
  const key = p.taskId + ':' + p.stoppedAt;
  if (modalKey === key) { tickModal(); return; } // already open — don't clobber typing
  modalKey = key;
  const t = task(p.taskId), proj = t && project(t.projectId);
  const next = p.thenStart && task(p.thenStart);
  const title = { stop: 'Stint stopped', finishTask: 'Finishing task', finishProject: 'Finishing project', closeSession: 'Closing session' }[p.action];
  root.innerHTML = `<div class="backdrop"><div class="modal" role="dialog" aria-modal="true">
    <h2>${title}: ${esc(t?.name ?? '')}</h2>
    <div class="hint">${esc(proj?.name ?? '')} · ${whenLabel(p.start)} – ${fmtTime(p.stoppedAt)}
      (${clock(p.stoppedAt - p.start)})${next ? ` · <b>${esc(next.name)}</b> starts when you close this` : ''}</div>
    <label for="notes">What did you do in this stint? (optional)</label>
    <textarea id="notes"></textarea>
    <div class="hint" id="modal-hint" style="margin-top:8px"></div>
    <div class="actions">
      <button class="btn" onclick="resolveNotes(true)">Skip</button>
      <button class="btn primary" onclick="resolveNotes(false)">Save notes</button>
    </div>
  </div></div>`;
  const ta = $('#notes');
  ta.value = p.draft || '';
  ta.addEventListener('input', () => {
    clearTimeout(draftTimer);
    draftTimer = setTimeout(() => fetch('/api/pending/draft', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ notes: ta.value }),
    }), 800);
    tickModal();
  });
  ta.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) resolveNotes(false); });
  ta.focus();
  tickModal();
}
function tickModal() {
  const p = S.pending, hint = $('#modal-hint');
  if (!p || !hint) return;
  const left = p.stoppedAt + S.notesGraceMs - nowMs();
  const cd = `<span class="countdown ${left < 120000 ? 'low' : ''}">${clock(left)}</span>`;
  hint.innerHTML = $('#notes').value.trim()
    ? `Saving now records the stint up to now (note-writing time counts). This closes in ${cd}, after which it ends at ${fmtTime(p.stoppedAt)}.`
    : `With no notes the stint ends at ${fmtTime(p.stoppedAt)}. This closes automatically in ${cd}.`;
  if (left <= 0) api('state'); // server auto-resolves
}
async function resolveNotes(dismissed) {
  clearTimeout(draftTimer);
  await api('pending/resolve', { notes: $('#notes')?.value ?? '', dismissed });
}

// ---------- client dialogs ----------
function closeDialog() { dialog = null; renderDialog(); }
function renderDialog() {
  const root = $('#dialog-root');
  if (!dialog) { root.innerHTML = ''; return; }
  if (dialog.type === 'addTime') { if (!root.innerHTML) renderAddTime(root); }
  else if (dialog.type === 'close') renderCloseDialog(root);
}

// Add time: either a completed stint, or start the timer from an earlier time.
function openAddTime(tid) {
  const end = Math.floor(nowMs() / 60000) * 60000;
  dialog = { type: 'addTime', taskId: tid, mode: 'add', start: end - 30 * 60000, end };
  $('#dialog-root').innerHTML = '';
  renderDialog();
}
function renderAddTime(root) {
  const d = dialog, t = task(d.taskId);
  const thisRunning = S.running?.taskId === t.id;
  const blocked = S.running || S.pending;
  root.innerHTML = `<div class="backdrop" onclick="if(event.target===this)closeDialog()"><div class="modal" role="dialog" aria-modal="true">
    <h2>Add time: ${esc(t.name)}</h2>
    <div class="hint">${esc(project(t.projectId)?.name ?? '')}</div>
    <div class="tabs">
      <button class="${d.mode === 'add' ? 'on' : ''}" onclick="dialog.mode='add'; $('#dialog-root').innerHTML=''; renderDialog()">Add a stint</button>
      <button class="${d.mode === 'start' ? 'on' : ''}" onclick="dialog.mode='start'; $('#dialog-root').innerHTML=''; renderDialog()">Start timer from…</button>
    </div>
    ${d.mode === 'add' ? `
      <div class="hint">Record time you worked without the timer. It's added to this task's current session.</div>
      <div class="fields">
        <div><label>Date</label><input type="date" id="at-date" value="${dayKey(d.start)}" max="${dayKey(nowMs())}"></div>
        <div><label>From</label><input type="time" id="at-from" value="${timeKey(d.start)}"></div>
        <div><label>To</label><input type="time" id="at-to" value="${timeKey(d.end)}"></div>
        <div><label>Duration (h:mm)</label><input type="text" id="at-dur" inputmode="numeric" placeholder="0:30"></div>
      </div>
      <label for="at-notes">Notes (optional)</label>
      <textarea id="at-notes"></textarea>
      <div class="actions">
        <button class="btn" onclick="closeDialog()">Cancel</button>
        <button class="btn primary" onclick="submitAddStint()">Add stint</button>
      </div>`
    : `
      <div class="hint">Start the timer as if you'd pressed Start at an earlier time today.</div>
      ${blocked ? `<div class="warnbox">${thisRunning ? 'This task’s timer is already running.' : 'Another timer is running. Stop it first, then come back here.'}</div>` : `
      <div class="fields">
        <div><label>Started at</label><input type="time" id="at-start" value="${timeKey(nowMs() - 15 * 60000)}"></div>
      </div>
      <label for="at-snotes">Notes (optional, pre-filled when you stop)</label>
      <textarea id="at-snotes"></textarea>`}
      <div class="actions">
        <button class="btn" onclick="closeDialog()">Cancel</button>
        <button class="btn go" ${blocked ? 'disabled' : ''} onclick="submitStartFrom()">Start timer</button>
      </div>`}
  </div></div>`;
  if (d.mode === 'add') {
    const from = $('#at-from'), to = $('#at-to'), dur = $('#at-dur');
    const parseDur = (v) => { const m = v.trim().match(/^(\d+)(?::(\d{1,2}))?$/); return m ? (+m[1] * 60 + +(m[2] || 0)) : null; };
    const mins = (v) => { const [h, m] = v.split(':').map(Number); return h * 60 + m; };
    const syncDur = () => {
      if (!from.value || !to.value) return;
      const m = mins(to.value) - mins(from.value);
      dur.value = m > 0 ? `${Math.floor(m / 60)}:${pad(m % 60)}` : '';
    };
    const syncTo = () => {
      const m = parseDur(dur.value);
      if (m == null || !from.value) return;
      const e = mins(from.value) + m;
      if (e < 24 * 60) to.value = `${pad(Math.floor(e / 60))}:${pad(e % 60)}`;
    };
    from.addEventListener('input', syncDur);
    to.addEventListener('input', syncDur);
    dur.addEventListener('input', syncTo);
    syncDur();
  }
}
async function submitAddStint() {
  const date = $('#at-date').value, from = $('#at-from').value, to = $('#at-to').value;
  if (!date || !from || !to) return toast('Fill in the date and times');
  const start = new Date(`${date}T${from}`).getTime(), end = new Date(`${date}T${to}`).getTime();
  if (end <= start) return toast('“To” must be after “From”');
  if (await api(`tasks/${dialog.taskId}/stints`, { start, end, notes: $('#at-notes').value })) {
    closeDialog();
    toast(`Added ${hm(end - start)}`, true);
  }
}
async function submitStartFrom() {
  const v = $('#at-start').value;
  if (!v) return toast('Choose a start time');
  const start = new Date(`${dayKey(nowMs())}T${v}`).getTime();
  if (start > nowMs()) return toast('Start time is in the future');
  if (await api(`tasks/${dialog.taskId}/start`, { start, notes: $('#at-snotes').value })) closeDialog();
}

// Close sessions: manual "End day", or the next-morning prompt for sessions left open.
function openCloseDialog(mode) {
  const list = mode === 'morning' ? staleSessions() : openSessions();
  dialog = { type: 'close', mode, ids: list.map((s) => s.id), selected: new Set(list.map((s) => s.id)), runningEnd: '' };
  renderDialog();
}
function renderCloseDialog(root) {
  const d = dialog;
  const prev = $('#cd-running-end');
  if (prev) d.runningEnd = prev.value;
  const list = d.ids.map((id) => S.sessions.find((s) => s.id === id && !s.closedAt)).filter(Boolean);
  if (!list.length) { dialog = null; root.innerHTML = ''; return; }
  const morning = d.mode === 'morning';
  const runningSess = S.running && list.find((s) => s.taskId === S.running.taskId);
  const selectedMs = list.filter((s) => d.selected.has(s.id)).reduce((a, s) => a + sessionMs(s), 0);
  root.innerHTML = `<div class="backdrop"><div class="modal" role="dialog" aria-modal="true">
    <h2>${morning ? 'Sessions left open from a previous day' : 'End of day'}</h2>
    <div class="hint">${morning
      ? 'Closing a session records its total and starts the task at 0:00 today. Untick any you want to carry on into today.'
      : 'Here are your open sessions. Enter the totals on the platform, then close them so each task starts at 0:00 tomorrow.'}</div>
    <div class="sess-list">
      ${list.map((s) => {
        const notes = sessionNotes(s);
        const isRunning = runningSess === s;
        return `<div class="item">
          <div class="line">
            <label><input type="checkbox" ${d.selected.has(s.id) ? 'checked' : ''} onchange="toggleSel('${s.id}', this.checked)">
              <span style="min-width:0">${sessLabel(s)}<br><span class="hint">opened ${whenLabel(s.openedAt)}${isRunning ? ' · <b>timer running</b>' : ''}</span></span></label>
            <span class="t num">${live('sid:' + s.id)}</span>
            <button class="btn small ghost" ${notes ? '' : 'disabled'} onclick='copyText(${esc(JSON.stringify(notes))})'>Copy notes</button>
          </div>
          ${notes ? `<div class="notes">${esc(notes)}</div>` : ''}
        </div>`;
      }).join('')}
    </div>
    ${runningSess && d.selected.has(runningSess.id) ? (morning
      ? `<div class="warnbox">The timer on <b>${esc(task(runningSess.taskId).name)}</b> has been running since ${whenLabel(S.running.start)}. When did you actually stop?
          <div style="margin-top:6px"><input type="datetime-local" id="cd-running-end" value="${d.runningEnd}"
            min="${dayKey(S.running.start)}T${timeKey(S.running.start)}"></div></div>`
      : `<div class="warnbox">The timer on <b>${esc(task(runningSess.taskId).name)}</b> is still running.
          <button class="btn small" onclick="api('stop',{})">Stop it now</button> (you'll be asked for notes), or untick it.</div>`) : ''}
    <div class="actions">
      <span class="hint" style="margin-right:auto; align-self:center">Selected: <b>${hm(selectedMs)}</b></span>
      <button class="btn" onclick="${morning ? 'keepAllOpen()' : 'closeDialog()'}">${morning ? 'Keep all open' : 'Cancel'}</button>
      <button class="btn primary" ${d.selected.size ? '' : 'disabled'} onclick="submitClose()">Close ${d.selected.size} session${d.selected.size === 1 ? '' : 's'}</button>
    </div>
  </div></div>`;
}
function toggleSel(id, on) { on ? dialog.selected.add(id) : dialog.selected.delete(id); renderDialog(); }
async function submitClose() {
  const d = dialog;
  const ids = [...d.selected];
  const runningSess = S.running && S.sessions.find((s) => ids.includes(s.id) && s.taskId === S.running.taskId);
  const body = { ids };
  if (d.mode === 'morning') body.day = dayKey(nowMs());
  if (runningSess) {
    if (d.mode !== 'morning') return toast('Stop the running timer first, or untick it');
    const v = $('#cd-running-end')?.value;
    if (!v) return toast('Enter when the running timer should have stopped');
    body.runningEnd = new Date(v).getTime();
  }
  if (await api('sessions/close', body)) {
    dialog = null; renderDialog();
    toast(`Closed ${ids.length} session${ids.length === 1 ? '' : 's'}`, true);
  }
}
async function keepAllOpen() {
  dialog = null; renderDialog();
  await api('daycheck', { day: dayKey(nowMs()) });
}

// Sessions opened before today that are still open.
const staleSessions = () => openSessions().filter((s) => s.openedAt < startOfToday());
function maybeDayCheck(e) {
  if (!S || S.pending || dialog) return;
  const today = dayKey(nowMs());
  if (S.lastDayCheck === today) return;
  if (staleSessions().length) {
    openCloseDialog('morning');
    if (e?.stopPropagation) { e.stopPropagation(); e.preventDefault(); } // don't let that first click act on the page
  }
}

// ---------- actions ----------
function addProject(e) {
  e.preventDefault();
  const name = e.target.name.value.trim();
  if (name) api('projects', { name });
  e.target.name.value = '';
}
function addTask(e, pid) {
  e.preventDefault();
  const name = e.target.name.value.trim();
  if (name) api('tasks', { projectId: pid, name });
  e.target.name.value = '';
}
function finishTask(tid) {
  if (confirm(`Finish task "${task(tid).name}"? Its open session will be closed.`)) api(`tasks/${tid}/finish`, {});
}
function finishProject(pid) {
  if (confirm(`Finish project "${project(pid).name}" and all its tasks?`)) api(`projects/${pid}/finish`, {});
}
function closeOne(tid) {
  const t = task(tid);
  if (confirm(`Close the session for "${t.name}" at ${hm(taskSessionMs(tid))}? The session counter resets to 0:00.`)) api(`tasks/${tid}/close-session`, {});
}
function deleteStint(id) {
  const st = S.stints.find((x) => x.id === id);
  if (st && confirm(`Delete the stint ${whenLabel(st.start)}–${fmtTime(st.end)} (${clock(st.end - st.start)})?`)) api(`stints/${id}/delete`, {});
}
function toggleExpand(id) { expanded.has(id) ? expanded.delete(id) : expanded.add(id); render(); }
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast('Copied', true); }
  catch { prompt('Copy:', text); } // clipboard API needs https or localhost
}

function download(name, rows) {
  const csv = rows.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = `${name}-${dayKey(nowMs())}.csv`;
  a.click();
}
const inHistFilter = (tid) => !histFilter || task(tid)?.projectId === histFilter;
function exportSessions() {
  const rows = [['Date', 'Project', 'Task', 'Status', 'Hours', 'Duration', 'Stints', 'Notes']];
  for (const s of S.sessions.filter((s) => task(s.taskId) && inHistFilter(s.taskId)).sort((a, b) => a.openedAt - b.openedAt)) {
    const t = task(s.taskId), ms = sessionMs(s);
    rows.push([dayKey(s.openedAt), project(t.projectId)?.name ?? '', t.name, s.closedAt ? 'closed' : 'open',
      hours(ms), clock(ms), stintsOf(s.id).length, sessionNotes(s)]);
  }
  download('sessions', rows);
}
function exportStints() {
  const rows = [['Date', 'Project', 'Task', 'Start', 'End', 'Hours', 'Duration', 'Added manually', 'Notes']];
  for (const st of S.stints.filter((st) => task(st.taskId) && inHistFilter(st.taskId)).sort((a, b) => a.start - b.start)) {
    const t = task(st.taskId);
    rows.push([dayKey(st.start), project(t.projectId)?.name ?? '', t.name, fmtTime(st.start), fmtTime(st.end),
      hours(st.end - st.start), clock(st.end - st.start), st.manual ? 'yes' : '', st.notes]);
  }
  download('stints', rows);
}

// ---------- wiring ----------
document.querySelectorAll('nav button').forEach((b) => b.addEventListener('click', () => {
  view = b.dataset.view;
  document.querySelectorAll('nav button').forEach((x) => x.classList.toggle('on', x === b));
  render();
}));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && dialog && !S?.pending) closeDialog(); });

// Live tick: update only the numbers so inputs aren't disturbed.
setInterval(() => {
  if (!S) return;
  document.querySelectorAll('[data-live]').forEach((el) => { el.textContent = liveValue(el.dataset.live); });
  document.title = S.running ? `${liveValue('run-sess')} · ${task(S.running.taskId)?.name ?? ''}`
    : S.pending ? '📝 Notes pending · Task Timer' : 'Task Timer';
  tickModal();
}, 1000);

// Sync with other tabs / server-side auto-resolve.
setInterval(() => { if (!document.hidden) api('state'); }, 10000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) api('state').then(() => maybeDayCheck()); });
// "First interaction of the day" check.
['click', 'keydown'].forEach((ev) => document.addEventListener(ev, maybeDayCheck, { capture: true }));

api('state').then(() => maybeDayCheck());
</script>
</body>
</html>
